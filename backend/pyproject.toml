[project]
name = "benren-learning-backend"
version = "0.3.0"
description = "Stage 3 backend for the Benren Learning product"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "boto3>=1.35,<2",
  "cryptography>=43,<46",
  "fastapi>=0.115,<1",
  "filetype>=1.2,<2",
  "httpx>=0.27,<1",
  "imageio-ffmpeg>=0.6,<1",
  "mutagen>=1.47,<2",
  "pillow>=10,<12",
  "pydantic-settings>=2.6,<3",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.12,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
  "volcengine>=1.0.227,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-q --disable-warnings --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic"]

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "filetype.*", "mutagen.*", "volcengine.*"]
ignore_missing_imports = true
